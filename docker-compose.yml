services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - mesai_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${MESAI_HTTP_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mesai_data:
